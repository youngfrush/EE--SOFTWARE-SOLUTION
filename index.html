    <meta name="description" content="Emmanuel Effiong (EE Software Solutions) - Full-Stack Developer & Forex Algorithmic Trading Strategy Architect. Building scalable code and high-performance trading systems." />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Source Code & Developer Tools Protection -->
    <script>
      (function() {
        // Disable right-click context menu
        document.addEventListener('contextmenu', function(e) {
          e.preventDefault();
        });

        // Disable specific shortcut keys used to open devtools or view source
        document.addEventListener('keydown', function(e) {
          // F12
          if (e.key === 'F12') {
            e.preventDefault();
          }
          // Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C
          if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C' || e.key === 'i' || e.key === 'j' || e.key === 'c')) {
            e.preventDefault();
          }
          // Ctrl+U (View Source)
          if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) {
            e.preventDefault();
          }
          // Ctrl+S (Save Page)
          if (e.ctrlKey && (e.key === 'S' || e.key === 's')) {
            e.preventDefault();
          }
        });

        // DevTools detection loop - halts execution with a debugger statement in production
        if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
          setInterval(function() {
            var start = performance.now();
            debugger;
            var end = performance.now();
            if (end - start > 100) {
              console.clear();
            }
          }, 100);
        }
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-blue-600/30 selection:text-blue-500">

    <script type="module" src="/src/main.tsx"></script>
  </body>
